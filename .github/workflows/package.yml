# A release event runs the workflow file stored at the tag's own commit, so a
# release cut from a tag predating this file cannot package itself. Dispatch
# with `tag` from the default branch to give those releases their assets.
name: Package App

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to its release. Leave empty to build the current ref without uploading.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Read app metadata
        id: app
        run: |
          {
            echo "version=$(jq -r .version app.json)"
            echo "name_slug=$(jq -r .nameSlug app.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve target tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            tag="$RELEASE_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches app.json version
        if: steps.target.outputs.tag != ''
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if [ "$TAG" != "$APP_VERSION" ]; then
            echo "::error::Tag $TAG does not match app.json version $APP_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rocket.Chat Apps CLI
        run: npm install -g @rocket.chat/apps-cli@1.13.0

      # rc-apps packages the working directory and names its own output, so each
      # build gets a clean dist/ and is staged outside the checkout — a finished
      # zip parked inside it would be swept into the next build.
      - name: Bundle app (compiled)
        env:
          SLUG: ${{ steps.app.outputs.name_slug }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          rm -rf dist && mkdir -p "$RUNNER_TEMP/artifacts"
          rc-apps package
          mv dist/*.zip "$RUNNER_TEMP/artifacts/${SLUG}_${APP_VERSION}-compiled.zip"

      - name: Bundle app (not compiled)
        env:
          SLUG: ${{ steps.app.outputs.name_slug }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          rm -rf dist
          rc-apps package --no-compile
          mv dist/*.zip "$RUNNER_TEMP/artifacts/${SLUG}_${APP_VERSION}-not-compiled.zip"

      - name: Verify packages contain no nested archives
        env:
          SLUG: ${{ steps.app.outputs.name_slug }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          status=0
          for kind in compiled not-compiled; do
            zip="$RUNNER_TEMP/artifacts/${SLUG}_${APP_VERSION}-${kind}.zip"
            nested=$(unzip -Z1 "$zip" | grep -i '\.zip$' || true)
            if [ -n "$nested" ]; then
              echo "::error::${kind} package contains nested archives:"
              echo "$nested"
              status=1
            fi
            echo "$kind: $(unzip -Z1 "$zip" | wc -l) files"
          done
          exit $status

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.app.outputs.name_slug }}_${{ steps.app.outputs.version }}
          path: ${{ runner.temp }}/artifacts/*.zip
          if-no-files-found: error

      - name: Attach packages to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.app.outputs.name_slug }}
          APP_VERSION: ${{ steps.app.outputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/artifacts/${SLUG}_${APP_VERSION}-compiled.zip" \
            "$RUNNER_TEMP/artifacts/${SLUG}_${APP_VERSION}-not-compiled.zip" \
            --clobber
