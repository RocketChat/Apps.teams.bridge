# Packages the app (compiled and not compiled) so the zips can be installed manually.
# On a tag push the zips are kept as a workflow artifact; on a published release
# they are also attached to that release.
name: Package App

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Read app metadata
        id: app
        run: |
          {
            echo "version=$(jq -r .version app.json)"
            echo "name_slug=$(jq -r .nameSlug app.json)"
          } >> "$GITHUB_OUTPUT"

      # A tag whose name disagrees with app.json produces zips nobody can match
      # to a marketplace version, so fail loudly instead.
      - name: Verify tag matches app.json version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "$APP_VERSION" ]; then
            echo "::error::Tag $tag does not match app.json version $APP_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rocket.Chat Apps CLI
        run: npm install -g @rocket.chat/apps-cli@1.13.0

      # rc-apps names its output itself and the name differs between modes
      # (--no-compile appends _no_compile), so each build gets a clean dist/
      # and whatever zip lands there is moved out under our own name.
      - name: Bundle app (compiled)
        env:
          SLUG: ${{ steps.app.outputs.name_slug }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          rm -rf dist && mkdir -p artifacts
          rc-apps package
          mv dist/*.zip "artifacts/${SLUG}_${APP_VERSION}-compiled.zip"

      - name: Bundle app (not compiled)
        env:
          SLUG: ${{ steps.app.outputs.name_slug }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          rm -rf dist
          rc-apps package --no-compile
          mv dist/*.zip "artifacts/${SLUG}_${APP_VERSION}-not-compiled.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.app.outputs.name_slug }}_${{ steps.app.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Attach packages to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.app.outputs.name_slug }}
          APP_VERSION: ${{ steps.app.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "artifacts/${SLUG}_${APP_VERSION}-compiled.zip" \
            "artifacts/${SLUG}_${APP_VERSION}-not-compiled.zip" \
            --clobber
